<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intro to css</title>
    <!-- internal -->
    <!-- <style>
      h1 {
        color: blue;
      }
    </style> -->
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playwrite+CU+Guides&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>hello</h1>
    <!-- inline -->
    <h1 style="color: blue">Hello World!</h1>
    <p style="color: brown">this is a css</p>

    <!-- element -->
    <h1 style="color: blue">Hello World</h1>

    <!-- class -->
    <h2 class="text">Hello World 2</h2>
    <h2 class="text1">Hello World 3</h2>

    <!-- id selector -->
    <h3 id="text">Hello</h3>

    <h2 class="value">hello</h2>
    <h2 id="value">hello</h2>

    <div class="parent">
      <h1 class="hello">Emmanuel</h1>
      <p class="helo">Emmanuel is a full stack developer</p>
    </div>

    <button class="btn1">Click Me</button>
    <button class="btn2">Dont Click</button>
  </body>
</html>
